[tool.poetry]
name = "blog-api"
version = "0.1.0"
description = "Simple blog system with REST API"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.104.0"
uvicorn = "^0.30.0"
