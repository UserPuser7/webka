{% extends "base.html" %}

{% block title %}Пользователи{% endblock %}

{% block content %}
<h1>Пользователи</h1>

<form class="row g-2 mb-3" method="get" action="/users">
    <div class="col-auto">
        <input type="text" class="form-control" name="q" placeholder="Поиск по логину и email" value="{{ query or '' }}">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-primary">Искать</button>
    </div>
</form>

{% if users %}
<ul class="list-group">
    {% for user in users %}
    <li class="list-group-item">
        <strong>{{ user.login }}</strong> — {{ user.email }}
    </li>
    {% endfor %}
</ul>
{% else %}
<p>Пользователи не найдены.</p>
{% endif %}
{% endblock %}
